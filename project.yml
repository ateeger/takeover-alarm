name: TakeoverAlarm
options:
  bundleIdPrefix: com.ateeger
  deploymentTarget:
    iOS: "26.0"
targets:
  TakeoverAlarm:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Takeover
        UILaunchScreen: {}
        NSAlarmKitUsageDescription: Lets this app ring full-screen alarms for your events.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ateeger.takeoveralarm
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
